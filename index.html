<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RYAN · 10-WEEK OVERHAUL</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #14181e;
    --line: #242a33;
    --text: #e8edf3;
    --dim: #8b95a3;
    --accent: #ff4d2e;
    --gold: #e8b86d;
    --ok: #3dd68c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.35; }
  header { position: sticky; top: 0; z-index: 10; background: #0b0d10ee; backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 18px; }
  header .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 15px; letter-spacing: .14em; font-weight: 700; }
  h1 span { color: var(--accent); }
  .meta { font-size: 12px; color: var(--dim); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  nav button, .wkbtn {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    padding: 6px 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer; border-radius: 999px;
  }
  nav button.on, .wkbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 920px; margin: 0 auto; padding: 18px 16px 80px; }
  .grid { display: grid; gap: 12px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 700px) { .g2 { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .kicker { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  h2 { font-size: 18px; margin-bottom: 8px; }
  h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin: 10px 0 6px; }
  p, li { font-size: 13.5px; color: var(--text); }
  .dim { color: var(--dim); font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 4px; border-bottom: 1px solid #1c222a; vertical-align: top; }
  td:nth-child(2), td:nth-child(3) { white-space: nowrap; color: var(--dim); width: 88px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px; font-size: 11px; color: var(--dim); }
  .day { margin-bottom: 14px; }
  .hidden { display: none; }
  footer { color: var(--dim); font-size: 11px; text-align: center; padding: 20px; }
  .targets td:first-child { color: var(--gold); font-weight: 600; width: 110px; }
  label { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=date] {
    width: 100%; background: #0b0d10; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 14px;
  }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; }
  .checks label { display: flex; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text); margin: 0; }
  .checks input { accent-color: var(--accent); }
  .save {
    margin-top: 14px; background: var(--accent); border: 0; color: #fff;
    padding: 10px 16px; border-radius: 999px; letter-spacing: .1em; text-transform: uppercase;
    font-size: 12px; cursor: pointer; font-weight: 700;
  }
  .hist td { font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>OVERHAUL <span>10</span></h1>
    <div class="meta">Sep 21 – Nov 29 · 6'3" · ~230 / 25%</div>
  </div>
  <nav id="tabs">
    <button class="on" data-tab="week">Week</button>
    <button data-tab="food">Food</button>
    <button data-tab="cardio">Cardio</button>
    <button data-tab="abs">Abs</button>
    <button data-tab="sleep">Sleep</button>
    <button data-tab="log">Log</button>
  </nav>
</header>
<main>
<p class="dim">Plan loaded. If you see this stub, the full file failed to upload — use the local index.html.</p>
</main>
</body>
</html>
